version: "2"
linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - contextcheck
    - durationcheck
    - errchkjson
    - errorlint
    - exhaustive
    - gocheckcompilerdirectives
    - gochecksumtype
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - gosmopolitan
    - loggercheck
    - makezero
    - misspell
    - musttag
    - nakedret
    - nilerr
    - nilnesserr
    - noctx
    - prealloc
    - protogetter
    - reassign
    - recvcheck
    - rowserrcheck
    - spancheck
    - sqlclosecheck
    - testifylint
    - unconvert
    - unparam
    - zerologlint
  settings:
    dupl:
      threshold: 100
    errcheck:
      check-type-assertions: false
      check-blank: false
    goconst:
      min-len: 3
      min-occurrences: 5
    gocritic:
      enabled-tags:
        - performance
      settings:
        captLocal:
          paramsOnly: true
        rangeValCopy:
          sizeThreshold: 32
    gocyclo:
      min-complexity: 20
    lll:
      tab-width: 1
    nakedret:
      max-func-lines: 30
    prealloc:
      simple: true
      range-loops: true
      for-loops: false
    unparam:
      check-exported: false
  exclusions:
    generated: lax
    rules:
      - linters:
          - dupl
          - errcheck
          - goconst
          - gocyclo
          - gosec
          - scopelint
          - unparam
        path: _test(ing)?\.go
      - linters:
          - gocritic
        path: _test\.go
        text: (unnamedResult|exitAfterDefer)
      - linters:
          - gocritic
        text: '(hugeParam|rangeValCopy):'
      - linters:
          - staticcheck
        text: 'SA3000:'
      - linters:
          - gosec
        text: 'G101:'
      - linters:
          - gosec
        text: 'G104:'
      - linters:
          - staticcheck
        text: 'SA1019: \(github.com/crossplane/upjet/v2/pkg/config.Reference\).Type is deprecated'
      # These APIs are retained for Crossplane's cluster-scoped managed-resource
      # compatibility path. crossplane-runtime still consumes the legacy event
      # recorder, while the API registration boilerplate exposes SchemeBuilder.
      - linters:
          - staticcheck
        path: 'apis/(cluster|namespaced)/v1(alpha1|beta1)/register\.go'
        text: 'SA1019: sigs.k8s.io/controller-runtime/pkg/scheme.Builder is deprecated'
      - linters:
          - staticcheck
        path: 'internal/clients/yandex-cloud\.go'
        text: 'SA1019: github.com/crossplane/crossplane-runtime/v2/pkg/resource.LegacyManaged is deprecated'
      - linters:
          - staticcheck
        path: 'internal/controller/(cluster|namespaced)/providerconfig/config\.go'
        text: 'SA1019: \(sigs.k8s.io/controller-runtime.Manager\).GetEventRecorderFor is deprecated'
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/yandex-cloud/crossplane-provider-yc
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
