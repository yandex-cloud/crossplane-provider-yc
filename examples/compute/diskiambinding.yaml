apiVersion: compute.yandex-cloud.jet.crossplane.io/v1alpha1
kind: DiskIAMBinding
metadata:
  annotations:
    meta.upbound.io/example-id: compute/v1alpha1/diskiambinding
  labels:
    testing.upbound.io/example-name: example-disk-iam-binding
  name: example-disk-iam-binding
spec:
  forProvider:
    diskIdRef:
      name: example-disk
    role: viewer
    serviceAccountRef:
      - name: example-sa
    sleepAfter: 5
  providerConfigRef:
    name: default
