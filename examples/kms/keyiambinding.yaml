apiVersion: kms.yandex-cloud.jet.crossplane.io/v1alpha1
kind: SymmetricKeyIAMBinding
metadata:
  name: example-sk-viewer
spec:
  forProvider:
    symmetricKeyIdRef:
      name: example-sk
    serviceAccountRef:
      - name: example-sa
    role: viewer
    sleepAfter: 5
  providerConfigRef:
    name: default
