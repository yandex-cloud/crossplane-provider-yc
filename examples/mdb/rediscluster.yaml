apiVersion: v1
kind: Secret
metadata:
  name: redis
  namespace: default
type: Opaque
data:
  # 12345678
  password: MTIzNDU2Nzg=
---
apiVersion: mdb.yandex-cloud.jet.crossplane.io/v1alpha1
kind: RedisCluster
metadata:
  name: example-redis
  annotations:
    meta.upbound.io/example-id: mdb/v1alpha1/rediscluster
    uptest.upbound.io/post-assert-hook: ../../cluster/test/redis-update.sh
    uptest.upbound.io/conditions: Ready,Synced,LastAsyncOperation,Test
spec:
  forProvider:
    name: example-redis
    description: Redis update regression
    environment: PRODUCTION
    networkIdRef:
      name: example-net
    config:
      - passwordSecretRef:
          name: redis
          key: password
          namespace: default
        version: "9.1-valkey"
    resources:
    - resourcePresetId: "b3-c1-m4"
      diskSize: 16
      diskTypeId: network-ssd
    maintenanceWindow:
      - type: ANYTIME
    host:
      - zone: ru-central1-a
        subnetIdRef:
          name: example-subnet-a
  providerConfigRef:
    name: default
  writeConnectionSecretToRef:
    name: redis-conn
    namespace: default
